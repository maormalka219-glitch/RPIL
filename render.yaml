services:
  - type: web
    name: police-db
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/providers
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/police.db
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOGIN_CODE
        value: KRdix
      - key: ACTION_CODE
        value: ad
    disk:
      name: police-data
      mountPath: /data
      sizeGB: 1
