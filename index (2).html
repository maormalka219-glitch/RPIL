<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מערכת מידע משטרתית</title>
<style>
:root{--bg:#05080f;--pan:#0b1426;--pan2:#101d38;--line:#1d3159;--tx:#e6ecf8;--mu:#8ea0c4;--ac:#2f6bff;--ok:#2fbf71;--wa:#e8a317;--er:#e5484d}
@media(prefers-color-scheme:light){:root{color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Heebo","Assistant",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}input,select,textarea{width:100%;background:#070d1b;border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:80px}button{background:var(--ac);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:600}button.ghost{background:transparent;border:1px solid var(--line)}button.sm{padding:4px 10px;font-size:13px}
:focus-visible{outline:2px solid #7fa3ff;outline-offset:2px}
#login{max-width:360px;margin:12vh auto;padding:28px;background:var(--pan);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:8px}
#login h1{font-size:20px;margin:0 0 4px}#login p{color:var(--mu);margin:0 0 18px}label{display:block;margin:10px 0;color:var(--mu);font-size:13px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--pan);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}.brand b{display:block;font-size:17px}.brand span{color:var(--mu);font-size:12px}
nav a{color:var(--mu);text-decoration:none;padding:9px 12px;border-radius:6px}nav a.on,nav a:hover{background:var(--pan2);color:var(--tx)}
.me{margin-top:auto;padding:12px 8px;border-top:1px solid var(--line);font-size:13px;color:var(--mu)}
main{padding:24px;max-width:1100px;width:100%}h2{margin:0 0 16px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:16px}.card h3{margin:0 0 10px;font-size:15px}
.stat b{display:block;font-size:30px}.stat span{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:13px}
tr.go{cursor:pointer}tr.go:hover{background:var(--pan2)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.approved{background:#12341f;color:var(--ok)}.suspended{background:#3a2a07;color:var(--wa)}.expired{background:#3c1416;color:var(--er)}.none{background:#1a2438;color:var(--mu)}
.av{width:56px;height:56px;border-radius:8px;background:var(--pan2);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;object-fit:cover;flex:none}
.head{display:flex;gap:16px;align-items:center;margin-bottom:16px}.head h2{margin:0}.head small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 20px}.grid div span{display:block;color:var(--mu);font-size:12px}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar input{max-width:420px}.row{display:flex;gap:8px;margin-top:12px}.sec{margin-top:16px}.sec>.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
dialog{background:var(--pan);color:var(--tx);border:1px solid var(--line);border-radius:8px;width:min(440px,92vw)}dialog::backdrop{background:#000a}
.err{color:var(--er);min-height:1.2em;margin:6px 0 0}.empty{color:var(--mu);padding:14px 0}.wrap{overflow-x:auto}
@media(max-width:760px){#app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;border:0;border-bottom:1px solid var(--line)}.brand,.me{display:none}main{padding:14px}}
</style></head><body><div id="root"></div><script src="app.js"></script></body></html>
